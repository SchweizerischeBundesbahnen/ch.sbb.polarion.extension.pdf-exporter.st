---
name: System Tests (Polarion in Docker)
# Integration tests for pull requests: spin up Polarion + WeasyPrint in Docker
# (via the testcontainers harness in tests/run.py) and run the .st system tests
# against pinned extension versions (see env below). This is the merge gate, so
# PRs no longer depend on the availability of the Polarion SUT.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Run the suite on Renovate's own branches so branch-automerge bumps
  # (automergeType: branch in renovate.json) are exercised by system-tests
  # before Renovate fast-forwards them into main. Renovate opens no PR for
  # these, so the pull_request trigger above never fires for them.
  push:
    branches: ['renovate/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: system-tests-${{ github.ref }}
  cancel-in-progress: true
env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: temurin
  # The PDF variant tests take long, so run.py leaves them out unless this is set; CI always runs them
  RUN_PDF_VARIANT_TESTS: 'true'
  TC_EXTENSION_VERSION: 13.10.2-SNAPSHOT
  TC_ADMIN_UTILITY_VERSION: 5.0.0
  TC_TEST_DATA_VERSION: 5.1.0
  TC_WEASYPRINT_SERVICE_IMAGE_NAME: ghcr.io/schweizerischebundesbahnen/weasyprint-service:70.0.3
  TC_POLARION_IMAGE_NAME: sbb.jfrog.io/polarion-docker/polarion/polarion:2606-0
  # The suite runs against the service the way it is deployed: TLS, with an API key. The service is
  # started here rather than by the harness, so it can be given a certificate and a key, and Polarion
  # joins its network to reach it under the name the certificate carries.
  WEASYPRINT_HOST: weasyprint.system-tests
  TC_POLARION_NETWORK: system-tests
  TC_WEASYPRINT_SERVICE_URL: https://weasyprint.system-tests:9080
  # ';'-separated; the secret names match WEASYPRINT_API_KEY_SECRET and BULK_PROCESSING_API_KEY_SECRET below.
  # The address of the bulk processing service is named here too: the harness hands it to Polarion as
  # BULK_PROCESSING_SERVICE_ENDPOINT, which the image turns into the property only where its
  # polarion.properties carries a placeholder for it, and polarion:2606-0 carries none. The value
  # matches TC_BULK_PROCESSING_SERVICE_URL below
  TC_POLARION_EXTRA_PROPERTIES: ch.sbb.polarion.extension.pdf-exporter.weasyprint.apiKeySecret=weasyprint.api.key;ch.sbb.polarion.extension.pdf-exporter.bulk.processing.service=https://bulk.system-tests:9070;ch.sbb.polarion.extension.pdf-exporter.bulk.processing.apiKeySecret=bulk.processing.api.key
  # the same name, used below to seed the key into that secret. The two literals sit together so an
  # edit to one is made looking at the other
  WEASYPRINT_API_KEY_SECRET: weasyprint.api.key
  # the name the service is started under below, so the cases which recreate it find it by name
  # rather than by matching the network alias, which the docker API has been moving away from
  WEASYPRINT_CONTAINER: weasyprint-service
  # The bulk processing service merges several exported documents into one PDF. It is deployed the way
  # WeasyPrint is -- TLS, with an API key -- and started here for the same reason: the harness can pass
  # it neither a certificate nor a key. Its certificate is signed by an authority of its own, so a case
  # which takes that authority out of the truststore breaks the Polarion -> bulk connection only, and
  # the exports through WeasyPrint keep working. The service in turn reaches WeasyPrint over TLS,
  # trusting its authority through SSL_CERT_FILE. The harness is handed the address
  # (TC_BULK_PROCESSING_SERVICE_URL) rather than an image, and passes it to Polarion through
  # BULK_PROCESSING_SERVICE_ENDPOINT.
  BULK_PROCESSING_SERVICE_IMAGE: ghcr.io/schweizerischebundesbahnen/bulk-processing-service:1.3.0
  BULK_PROCESSING_HOST: bulk.system-tests
  TC_BULK_PROCESSING_SERVICE_URL: https://bulk.system-tests:9070
  BULK_PROCESSING_API_KEY_SECRET: bulk.processing.api.key
  # the name the service is started under below, so the cases which recreate it find it by name
  BULK_PROCESSING_CONTAINER: bulk-processing-service
  # The cases of test_bulk_processing_jwt cover the Polarion tokens which bind a merge job to the user who started
  # it: the extension sends them, the service checks them against the key set Polarion publishes. Both the service
  # image and the extension above have to know the tokens. This makes the cases fail, rather than skip, when the
  # service ignores the tokens, so a skip cannot leave the required check green over a run which covered nothing.
  # A service which knows the tokens paired with an extension which does not sends the merge cases into a 409
  # ("Missing Polarion token"), which is also a failure: the two versions are raised together.
  BULK_PROCESSING_REQUIRE_JWT: 'true'
jobs:
  system-tests:
    # Skip draft PRs (this container suite is expensive); still runs on manual workflow_dispatch.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IO_JFROG_SBB_POLARION_TOKEN: ${{ secrets.IO_JFROG_SBB_POLARION_TOKEN }}
    steps:
      - name: 📄 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: 🐍 Set up Python from .tool-versions
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .tool-versions
      - name: 🧱 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - name: ☕ Set up JDK and Maven
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - name: 🔐 Configure Maven settings.xml (from repo .mvn/settings.xml)
        run: |
          mkdir -p "$HOME/.m2"
          cp "$GITHUB_WORKSPACE/.mvn/settings.xml" "$HOME/.m2/settings.xml"
      - name: 🐳 Log in to sbb.jfrog.io Docker registry
        run: |
          # Token-only auth (same token as the Maven X-JFrog-Art-Api header). For a JFrog access
          # token the username is not validated, so a fixed placeholder is enough.
          printf '%s' "$IO_JFROG_SBB_POLARION_TOKEN" | docker login sbb.jfrog.io -u polarion --password-stdin
      - name: 🧱 Install dependencies
        run: uv sync --frozen
      # The suite exports over TLS with a key, so the job issues its own authority and certificate for
      # the name the service answers under, and a key which lives as long as the run. Polarion is
      # given the authority, the property naming the secret and the key itself, all before it starts:
      # it reads its properties and its secrets once and keeps them.
      - name: 📜 Issue the certificates the WeasyPrint and bulk processing services serve
        run: |
          mkdir -p "$RUNNER_TEMP/tls"
          cd "$RUNNER_TEMP/tls"
          openssl genrsa -out ca.key 4096
          # keyUsage=keyCertSign is required by the bulk processing service, which verifies WeasyPrint's
          # TLS with Python's ssl.create_default_context() (OpenSSL 3): it rejects a CA without keyUsage
          # ("CA cert does not include key usage extension"), so the service reports WeasyPrint
          # unavailable, its /ready returns 503 and the merge cases fail. curl and the JVM truststore
          # accept such a CA, so only the bulk path needs this.
          openssl req -x509 -new -key ca.key -sha256 -days 30 -out ca.pem \
            -subj "/CN=Polarion system tests CA" \
            -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl genrsa -out service.key 2048
          openssl req -new -key service.key -out service.csr -subj "/CN=$WEASYPRINT_HOST"
          printf 'basicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\nsubjectAltName=DNS:%s\n' "$WEASYPRINT_HOST" > service.ext
          openssl x509 -req -in service.csr -CA ca.pem -CAkey ca.key -CAcreateserial \
            -out service.crt -days 30 -sha256 -extfile service.ext
          cat service.crt ca.pem > service.pem
          # The bulk processing service gets an authority of its own, so taking it out of the truststore
          # breaks the Polarion -> bulk connection and nothing else. Its name contains no other one:
          # the cases find the alias of an authority by its common name. keyUsage as above, which the
          # JVM does not insist on, but a CA without it is not one a deployment should model
          openssl genrsa -out bulk-ca.key 4096
          openssl req -x509 -new -key bulk-ca.key -sha256 -days 30 -out bulk-ca.pem \
            -subj "/CN=Bulk processing system tests authority" \
            -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign"
          # the certificate the service serves, and one by the same authority for a name the service is
          # not reached under, for the case which shows that the name is checked and not only the chain
          for cert in "bulk:$BULK_PROCESSING_HOST" "bulk-other-name:not-the-bulk-service.system-tests"; do
            file="${cert%%:*}"
            name="${cert#*:}"
            openssl genrsa -out "$file.key" 2048
            openssl req -new -key "$file.key" -out "$file.csr" -subj "/CN=$name"
            printf 'basicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\nsubjectAltName=DNS:%s\n' "$name" > "$file.ext"
            openssl x509 -req -in "$file.csr" -CA bulk-ca.pem -CAkey bulk-ca.key -CAcreateserial \
              -out "$file.crt" -days 30 -sha256 -extfile "$file.ext"
            cat "$file.crt" bulk-ca.pem > "$file.pem"
          done
          chmod 644 ./*.pem ./*.key
          # keys which live as long as this run, so no credential is written into the repository
          weasyprint_api_key="$(openssl rand -hex 24)"
          bulk_processing_api_key="$(openssl rand -hex 24)"
          # masked at the point they are minted, which covers every step and every test that receives them
          echo "::add-mask::$weasyprint_api_key"
          echo "::add-mask::$bulk_processing_api_key"
          # TC_POLARION_SECRETS is what seeds the keys into the store of Polarion before the container
          # runs: Polarion reads its secrets when it starts and keeps them, so one written into a
          # running Polarion is never seen. Both authorities go into its truststore.
          {
            echo "WEASYPRINT_API_KEY=$weasyprint_api_key"
            echo "BULK_PROCESSING_API_KEY=$bulk_processing_api_key"
            echo "TC_POLARION_CA_CERTIFICATES=$RUNNER_TEMP/tls/ca.pem,$RUNNER_TEMP/tls/bulk-ca.pem"
            echo "TC_POLARION_SECRETS=$WEASYPRINT_API_KEY_SECRET=$weasyprint_api_key;$BULK_PROCESSING_API_KEY_SECRET=$bulk_processing_api_key"
          } >> "$GITHUB_ENV"
      # Started here rather than by the harness, which can pass neither a certificate nor a key. The
      # network alias is the name the certificate carries, and Polarion joins the same network, so it
      # reaches the service under a name the certificate covers.
      - name: 🔒 Start the WeasyPrint service over TLS
        run: |
          docker network create "$TC_POLARION_NETWORK"
          docker run --detach --name "$WEASYPRINT_CONTAINER" \
            --network "$TC_POLARION_NETWORK" --network-alias "$WEASYPRINT_HOST" \
            --volume "$RUNNER_TEMP/tls:/tls:ro" \
            --env API_KEY="$WEASYPRINT_API_KEY" \
            --env TLS_CERT_FILE=/tls/service.pem \
            --env TLS_KEY_FILE=/tls/service.key \
            "$TC_WEASYPRINT_SERVICE_IMAGE_NAME"
          # The image carries its own probe, and it follows the configured scheme, so waiting on the
          # health of the container beats asking again from here. `docker run` has no wait of its own.
          # A container which has already exited, on a certificate it cannot read, is not waited for.
          # shellcheck disable=SC2016  # the expansion belongs to the inner shell, on every turn
          timeout 90 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" "$WEASYPRINT_CONTAINER")" = healthy ]; do
              [ "$(docker inspect -f "{{.State.Running}}" "$WEASYPRINT_CONTAINER")" = true ] || exit 1
              sleep 2
            done' \
            || { echo "the WeasyPrint service did not become healthy"; docker logs "$WEASYPRINT_CONTAINER"; exit 1; }
      # Started here for the reason WeasyPrint is. It serves its own certificate under the alias the
      # certificate carries, holds its own key, and reaches WeasyPrint over TLS: with the WeasyPrint key,
      # trusting the WeasyPrint authority through SSL_CERT_FILE. The directory holds the certificate for
      # another name as well, which a case swaps in by recreating the container.
      - name: 🔒 Start the bulk processing service over TLS
        run: |
          docker run --detach --name "$BULK_PROCESSING_CONTAINER" \
            --network "$TC_POLARION_NETWORK" --network-alias "$BULK_PROCESSING_HOST" \
            --volume "$RUNNER_TEMP/tls:/tls:ro" \
            --env API_KEY="$BULK_PROCESSING_API_KEY" \
            --env TLS_CERT_FILE=/tls/bulk.pem \
            --env TLS_KEY_FILE=/tls/bulk.key \
            --env WEASYPRINT_SERVICE_URL="$TC_WEASYPRINT_SERVICE_URL" \
            --env WEASYPRINT_API_KEY="$WEASYPRINT_API_KEY" \
            --env SSL_CERT_FILE=/tls/ca.pem \
            "$BULK_PROCESSING_SERVICE_IMAGE"
          # shellcheck disable=SC2016  # the expansion belongs to the inner shell, on every turn
          timeout 90 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" "$BULK_PROCESSING_CONTAINER")" = healthy ]; do
              [ "$(docker inspect -f "{{.State.Running}}" "$BULK_PROCESSING_CONTAINER")" = true ] || exit 1
              sleep 2
            done' \
            || { echo "the bulk processing service did not become healthy"; docker logs "$BULK_PROCESSING_CONTAINER"; exit 1; }
      - name: 🧪 Run system tests against Polarion in Docker
        run: uv run tox -e test
      - name: 🧾 WeasyPrint service log
        if: always()
        # the containers replaced during the run print their own log as they go, from the suite
        run: docker logs "$WEASYPRINT_CONTAINER" 2>/dev/null || true
      - name: 🧾 Bulk processing service log
        if: always()
        run: docker logs "$BULK_PROCESSING_CONTAINER" 2>/dev/null || true
      - name: 📤 Upload test reports and generated/diff artifacts
        # Always upload so failures can be diagnosed: the output folder contains the generated
        # PDFs, the rendered page PNGs and the *_diff.png images highlighting visual mismatches.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: system-test-reports
          path: |
            TEST-*.xml
            test-data/output/**
          if-no-files-found: warn
          retention-days: 7
